<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckan · Receptbok</title>
<meta name="description" content="Veckans rätter och inköpslistan som följer av dem.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <h1>Veckan</h1>
  <p class="tagline"><a href="/">← Recepten</a> · <a href="/inkopslistan">Inköpslistan</a></p>
  <div class="account" id="account" hidden>
    <span id="account-name"></span>
    <button type="button" id="signout" class="linkbutton">Logga ut</button>
  </div>
</header>

<main>
  <p id="status" class="status" role="status">Kontrollerar …</p>

  <section class="panel" id="gate" hidden>
    <p>Gå till <a href="/">startsidan</a> för att logga in och skapa ditt hushåll.</p>
  </section>

  <div id="planner" hidden>
    <section class="panel">
      <h2>Planera in en rätt</h2>
      <form class="form" id="plan-form">
        <div class="row">
          <span>
            <label for="plan-recipe">Recept</label>
            <select id="plan-recipe" required></select>
          </span>
          <span>
            <label for="plan-day">Dag</label>
            <select id="plan-day"></select>
          </span>
          <span>
            <label for="plan-servings">Portioner</label>
            <input type="number" id="plan-servings" min="1" max="99" inputmode="numeric">
          </span>
        </div>
        <button type="submit" class="button">Lägg till i veckan</button>
      </form>
      <p class="muted" id="plan-hint"></p>
    </section>

    <section>
      <h2 class="sectionhead">Veckans rätter</h2>
      <ul id="week" class="week"></ul>
    </section>

    <section>
      <p class="muted">Inköpslistan räknas fram ur den här planen.</p>
      <a class="button" href="/inkopslistan">Öppna inköpslistan</a>
    </section>
  </div>
</main>

<footer class="footer">
  <span id="meta"></span>
</footer>

<script type="module" src="/veckan.js"></script>
</body>
</html>
