<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leasingskanner</title>
<meta name="description" content="Svenska leasingerbjudanden, normaliserade och prisbedömda.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <h1>Leasingskanner</h1>
  <p class="tagline">Svenska leasingerbjudanden – normaliserade och prisbedömda.</p>
</header>

<main>
  <form id="filters" class="filters" autocomplete="off">
    <label>Sök
      <input type="search" name="q" placeholder="märke, modell, utrustning">
    </label>
    <label>Max kr/mån
      <input type="number" name="maxMonthly" min="0" step="100" placeholder="4000">
    </label>
    <label>Löptid
      <select name="term">
        <option value="">alla</option>
        <option value="24">24 mån</option>
        <option value="36">36 mån</option>
        <option value="48">48 mån</option>
        <option value="60">60 mån</option>
      </select>
    </label>
    <label>Sortering
      <select name="sort">
        <option value="effective_monthly_sek">Effektiv månadskostnad</option>
        <option value="monthly_sek">Månadskostnad</option>
        <option value="last_seen">Senast sedd</option>
      </select>
    </label>
  </form>

  <p id="status" class="status" role="status">Laddar …</p>
  <ul id="results" class="results"></ul>
</main>

<footer class="footer">
  <span id="meta"></span>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
