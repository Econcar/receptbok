name: Skanna leasingerbjudanden

on:
  schedule:
    # Var 6:e timme. GitHub kör i UTC och kan försena körningar vid hög last.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Kommaseparerade käll-id (tomt = alla aktiva)'
        required: false
        default: ''
      dry_run:
        description: 'Skriv inget till Supabase'
        type: boolean
        required: false
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Inga beroenden att installera – skannern använder bara Node-inbyggt.
      - name: Kör skannern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_SOURCES: ${{ github.event.inputs.sources }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scanner/run.mjs
