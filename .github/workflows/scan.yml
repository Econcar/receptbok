name: Skanna leasingerbjudanden

on:
  # Schemat är avstängt. Projektet är på väg att göras om till något annat, och
  # en cron som fyller databasen med 1 600 rader per dygn av data ingen vill ha
  # är bara i vägen. Ta bort kommentaren för att starta den igen.
  #
  # schedule:
  #   # Var 6:e timme. GitHub kör i UTC och kan försena körningar vid hög last.
  #   - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Kommaseparerade käll-id (tomt = alla aktiva)'
        required: false
        default: ''
      dry_run:
        description: 'Skriv inget till Supabase'
        type: boolean
        required: false
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Inga beroenden att installera – skannern använder bara Node-inbyggt.
      - name: Kör skannern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_SOURCES: ${{ github.event.inputs.sources }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          # Repo-variabler (Settings → Secrets and variables → Actions → Variables).
          # Tomma värden är ofarliga: adaptern faller tillbaka på sina standardvärden.
          ALLEASING_MAX_OFFERS: ${{ vars.ALLEASING_MAX_OFFERS }}
          ALLEASING_DELAY_MS: ${{ vars.ALLEASING_DELAY_MS }}
        run: node scanner/run.mjs
